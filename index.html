<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOLE STORY V2</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"PingFang SC",sans-serif;background:#82cbff;color:#432d29}.game{max-width:900px;margin:auto;min-height:100vh;background:linear-gradient(#9bdcff 0 28%,#efbf7b 28%);overflow:hidden}.sky{height:210px;padding:28px 15px;position:relative;overflow:hidden}.cloud{position:absolute;font-size:48px;opacity:.7;animation:cloud 7s ease-in-out infinite alternate}.c1{left:5%;top:90px}.c2{right:7%;top:40px;animation-delay:-3s}@keyframes cloud{to{transform:translateX(25px)}}.title{text-align:center}.title h1{font-size:clamp(42px,9vw,72px);margin:0;color:#fff;text-shadow:0 5px #61496d}.title p{display:inline-block;background:#955d3d;color:white;padding:7px 20px;border-radius:14px;font-weight:900}.bar{position:absolute;right:12px;top:10px;background:#503a3e;color:white;padding:9px 13px;border-radius:18px;font-weight:800;z-index:10}.shop{padding:16px;background:linear-gradient(150deg,#f9d99e,#c47b49);border-top:7px solid #75452f;min-height:600px}.panel{background:#fff9eb;border:4px solid #75452f;border-radius:22px;box-shadow:0 8px #75452f;margin:0 auto 16px;padding:17px;max-width:740px}.customer{display:flex;gap:13px;align-items:center}.avatar{font-size:58px;background:#c1efff;border:4px solid #75452f;border-radius:50%;width:84px;height:84px;display:grid;place-items:center;animation:float 2s ease-in-out infinite}@keyframes float{50%{transform:translateY(-8px) rotate(4deg)}}.speech{flex:1;font-weight:700}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.tag{background:#e3f6ff;padding:5px 8px;border-radius:12px}.lab h2{text-align:center}.stage{height:175px;display:grid;place-items:center;position:relative;overflow:hidden}.shoe{font-size:95px;z-index:3;animation:idle 2s ease-in-out infinite}@keyframes idle{50%{transform:translateY(-6px) rotate(-3deg)}}.shoe.fuse{animation:shake .12s linear 12}@keyframes shake{25%{transform:translate(-7px,2px) rotate(-5deg)}75%{transform:translate(7px,-2px) rotate(5deg)}}.aura{position:absolute;width:100px;height:100px;border:6px solid #ffe96b;border-radius:50%;opacity:0}.aura.go{animation:aura 1.2s ease-out}@keyframes aura{20%{opacity:1;transform:scale(.5)}100%{opacity:0;transform:scale(2.5)}}.flash{position:absolute;inset:0;background:white;opacity:0;z-index:8}.flash.go{animation:flash .5s}@keyframes flash{40%{opacity:.95}100%{opacity:0}}.fly{position:absolute;font-size:42px;z-index:6;animation:fly .85s ease-in forwards}@keyframes fly{to{left:50%!important;top:50%!important;transform:translate(-50%,-50%) scale(.2) rotate(360deg);opacity:.1}}.name,.status{text-align:center;font-weight:900;min-height:26px}.materials{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.mat{border:3px solid #8b593c;border-radius:14px;background:white;padding:9px 2px;font-size:28px;box-shadow:0 4px #8b593c;transition:.18s}.mat span{display:block;font-size:12px;font-weight:800}.mat.on{background:#fff0a6;transform:translateY(3px) scale(1.04);box-shadow:0 1px #8b593c;animation:pop .28s}@keyframes pop{50%{transform:translateY(-6px) scale(1.15)}}.btn{width:100%;border:0;border-radius:16px;background:#f47b38;color:white;font-weight:900;font-size:20px;padding:14px;margin-top:14px;box-shadow:0 6px #9e4428}.result{text-align:center;display:none}.result.show{display:block;animation:in .6s ease-out}@keyframes in{from{opacity:0;transform:scale(.8) translateY(20px)}}.big{font-size:95px;animation:reveal .8s}@keyframes reveal{0%{transform:scale(.2) rotate(-20deg)}70%{transform:scale(1.2)}}.stars{font-size:38px}.secret{display:none;background:#7454a7;color:white;padding:10px;border-radius:14px;font-weight:900}.secret.show{display:block;animation:pop .5s}.reset{background:#7454a7;box-shadow:0 6px #49356b}.note{text-align:center;font-size:12px;opacity:.7}
</style></head><body><main class="game"><div class="bar">🪙 <span id="coins">500</span>　⭐ <span id="fame">0</span></div><section class="sky"><div class="cloud c1">☁️</div><div class="cloud c2">☁️</div><div class="title"><h1>SOLE STORY</h1><p>奇想鞋店 · V2</p></div></section><section class="shop"><div id="play"><div class="panel customer"><div class="avatar" id="avatar">🪼</div><div class="speech"><b>水母少女的订单</b><br>“我想要一双可以在水里走、可爱，而且最好会发光的鞋！”<div class="tags"><span class="tag">💧 防水</span><span class="tag">💗 可爱</span><span class="tag">✨ 发光</span></div></div></div><div class="panel lab"><h2>🔧 奇想融合实验台</h2><div class="stage" id="stage"><div class="aura" id="aura"></div><div class="shoe" id="shoe">👟</div><div class="flash" id="flash"></div></div><div class="name" id="name">选择 1～3 个元素</div><div class="status" id="status"></div><div class="materials"><button class="mat" data-id="water" data-e="💧">💧<span>水滴</span></button><button class="mat" data-id="jelly" data-e="🪼">🪼<span>水母</span></button><button class="mat" data-id="star" data-e="⭐">⭐<span>星星</span></button><button class="mat" data-id="fire" data-e="🔥">🔥<span>火焰</span></button><button class="mat" data-id="cloud" data-e="☁️">☁️<span>云朵</span></button><button class="mat" data-id="wing" data-e="🪽">🪽<span>翅膀</span></button><button class="mat" data-id="bread" data-e="🍞">🍞<span>吐司</span></button><button class="mat" data-id="cactus" data-e="🌵">🌵<span>仙人掌</span></button></div><button class="btn" id="make">✨ 开始融合</button><p class="note">最多选择 3 个元素 · 有些组合藏着特殊配方</p></div></div><div class="panel result" id="result"><div class="big" id="resultShoe"></div><h2 id="resultName"></h2><div class="secret" id="secret">🔮 SECRET RECIPE（隐藏配方）· 发现特殊鞋！</div><div class="stars" id="stars"></div><h3 id="comment"></h3><p id="reward"></p><button class="btn reset" id="again">继续实验</button></div></section></main>
<script>
const S=new Set(),M=[...document.querySelectorAll(".mat")],L={water:"水滴",jelly:"水母",star:"星光",fire:"火焰",cloud:"云朵",wing:"飞翼",bread:"吐司",cactus:"仙人掌"},R={"jelly,star,water":["星海水母鞋","🌊👟🪼✨"],"fire,star,wing":["流星火翼鞋","🔥🪽👟🪽⭐"],"bread,cloud,star":["星云吐司鞋","☁️🍞👟⭐"]},$=x=>document.querySelector(x),wait=x=>new Promise(r=>setTimeout(r,x));let busy=false;
M.forEach(b=>b.addEventListener("click",()=>{if(busy)return;let i=b.dataset.id;if(S.has(i)){S.delete(i);b.classList.remove("on")}else if(S.size<3){S.add(i);b.classList.add("on")}$("#name").textContent=S.size?[...S].map(x=>L[x]).join(" + "):"选择 1～3 个元素"}));
function key(){return[...S].sort().join(",")}
function fly(){let st=$("#stage"),r=st.getBoundingClientRect();[...S].forEach(i=>{let b=document.querySelector(`[data-id="${i}"]`),q=b.getBoundingClientRect(),e=document.createElement("div");e.className="fly";e.textContent=b.dataset.e;e.style.left=(q.left-r.left+q.width/2)+"px";e.style.top="145px";st.appendChild(e);setTimeout(()=>e.remove(),900)})}
$("#make").addEventListener("click",async()=>{if(busy)return;if(!S.size)return alert("先选择至少一个元素吧！");busy=true;$("#status").textContent="元素正在靠近……";fly();await wait(850);$("#status").textContent="能量融合中！";$("#shoe").classList.add("fuse");$("#aura").classList.add("go");await wait(850);$("#flash").classList.add("go");await wait(250);let r=R[key()];$("#shoe").textContent=r?r[1]:S.has("wing")?"🪽👟🪽":S.has("fire")?"🔥👟🔥":S.has("jelly")?"👟🪼":"✨👟✨";await wait(500);finish(r)});
function finish(r){let q=1;["water","jelly","star"].forEach(x=>S.has(x)&&q++);if(r)q=5;q=Math.min(5,q);let rw=q*100,c=+(localStorage.soleCoins||500)+rw,f=+(localStorage.soleFame||0)+q;localStorage.soleCoins=c;localStorage.soleFame=f;$("#coins").textContent=c;$("#fame").textContent=f;$("#resultShoe").textContent=r?r[1]:$("#shoe").textContent;$("#resultName").textContent=r?r[0]:[...S].map(x=>L[x]).join("·")+"奇想鞋";$("#stars").textContent="⭐".repeat(q)+"☆".repeat(5-q);$("#comment").textContent=q>=5?"水母少女：天啊！它真的活过来了！":q>=3?"水母少女：好可爱！还能更神奇一点～":"水母少女：我们再试一次？";$("#reward").textContent="获得 🪙 "+rw+"　品牌星星 +"+q;if(r)$("#secret").classList.add("show");$("#play").style.display="none";$("#result").classList.add("show")}
$("#again").addEventListener("click",()=>location.reload());$("#coins").textContent=localStorage.soleCoins||500;$("#fame").textContent=localStorage.soleFame||0;
</script></body></html>
