<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>奇想鞋店 V3.5 · 幻梦视觉版</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,"PingFang SC",sans-serif;background:#20140f;color:#4b3022}.game{max-width:920px;margin:auto;min-height:100vh;background:radial-gradient(circle at 50% 10%,#75502f,#2a1912 62%);padding:14px}.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;background:#291913e8;color:#fff4dc;border:1px solid #8e673d;border-radius:18px;padding:10px 15px}.brand{font-weight:900;font-size:20px}.money{font-weight:900}.scene{min-height:260px;margin-top:12px;border-radius:24px;border:2px solid #8f673c;background:linear-gradient(#39251b99,#39251bcc),radial-gradient(circle at 50% 25%,#d9994d,#4a2a19 68%);position:relative;overflow:hidden;display:grid;place-items:center;padding:22px}.scene:before{content:"✦　·　✧　·　✦";position:absolute;top:22px;color:#ffd98b;font-size:25px;opacity:.55}.sign{text-align:center;color:#fff2d3;text-shadow:0 3px 10px #000}.sign h1{font-size:clamp(42px,10vw,72px);margin:0}.sign p{letter-spacing:5px}.panel{background:#f7ead0;border:2px solid #9b7448;border-radius:20px;padding:16px;margin-top:12px;box-shadow:0 8px 22px #0005}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.nav button,.btn{border:1px solid #a87c43;background:linear-gradient(#fff3d5,#e4bd79);border-radius:15px;padding:12px 5px;font-weight:900;color:#50351f;box-shadow:0 4px #8a6137}.nav button.on{background:#d8a450;color:white}.view{display:none}.view.on{display:block}.customer{display:flex;gap:14px;align-items:center}.avatar{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;font-size:60px;background:radial-gradient(#c9f5ff,#a786dc);animation:float 2.5s ease-in-out infinite}@keyframes float{50%{transform:translateY(-8px)}}.speech{flex:1}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{padding:5px 9px;background:#fff8e9;border-radius:10px}.shopgrid,.mats,.book{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:#fff7e6;border:1px solid #c7a575;border-radius:15px;padding:12px;text-align:center}.ico{font-size:42px}.locked{filter:grayscale(.7);opacity:.65}.labstage{height:230px;position:relative;display:grid;place-items:center;background:radial-gradient(circle,#6b4a2e,#271812 70%);border-radius:18px;overflow:hidden}.shoe{font-size:100px;z-index:3;filter:drop-shadow(0 0 12px #ffc85a);animation:idle 2s ease-in-out infinite}@keyframes idle{50%{transform:translateY(-8px) rotate(-3deg)}}.shoe.fuse{animation:shake .1s linear 16}@keyframes shake{25%{transform:translate(-9px,4px) rotate(-7deg)}75%{transform:translate(9px,-4px) rotate(7deg)}}.ring{position:absolute;width:120px;height:50px;border:3px solid #ffd97c;border-radius:50%;box-shadow:0 0 25px #ffd15c;animation:ring 2s linear infinite}@keyframes ring{to{transform:rotate(360deg) scale(1.5);opacity:.2}}.particle{position:absolute;font-size:30px;animation:fall 1.1s ease-in forwards;z-index:5}@keyframes fall{to{left:50%!important;top:50%!important;transform:scale(.1) rotate(540deg);opacity:0}}.mats{grid-template-columns:repeat(5,1fr);margin-top:10px}.mat{border:1px solid #b58b54;background:#fff8e9;border-radius:12px;padding:8px 2px;font-size:28px}.mat small{display:block;font-size:11px}.mat.on{background:#ffe19b;transform:translateY(-3px)}.mat:disabled{opacity:.3}.mainbtn{width:100%;margin-top:12px;background:linear-gradient(#ffd77d,#c8892f);font-size:18px}.result{text-align:center}.resultshoe{font-size:100px}.stars{font-size:30px}.notice{background:#5d3d78;color:white;border-radius:12px;padding:9px;margin:8px 0}.upgrade{display:flex;justify-content:space-between;align-items:center;margin:8px 0;padding:10px;background:#fff7e7;border-radius:12px}.muted{opacity:.7;font-size:12px}@media(min-width:650px){.shopgrid{grid-template-columns:repeat(5,1fr)}.book{grid-template-columns:repeat(3,1fr)}}</style>
<style id="v35-dream">

.labstage:after{content:"";position:absolute;width:220px;height:86px;border:3px solid #ffd879;border-radius:50%;box-shadow:0 0 16px #ffd15d,0 0 55px #bd75ff99;animation:v35spin 5s linear infinite}
@keyframes v35spin{to{transform:rotate(360deg)}}

</head><body><main class="game"><header class="top"><div class="brand">奇想鞋店 <small>SOLE STORY · V3.5</small></div><div class="money">🪙 <span id="coins"></span>　⭐ <span id="fame"></span></div></header><section class="scene"><div class="sign"><h1>奇想鞋店</h1><p>每一双鞋，都从梦里诞生</p></div></section><div class="panel nav"><button data-v="customer" class="on">🚪<br>顾客</button><button data-v="store">🛒<br>商店</button><button data-v="book">📖<br>图鉴</button><button data-v="upgrade">🏠<br>店铺</button></div><section id="customer" class="view on"><div class="panel customer"><div class="avatar" id="avatar"></div><div class="speech"><b id="cname"></b><p id="ctext"></p><div class="tags" id="tags"></div></div></div><div class="panel"><h2>✨ 幻梦融合台</h2><div class="labstage" id="stage"><div class="ring"></div><div class="shoe" id="shoe">👟</div></div><p id="mixname" style="text-align:center;font-weight:900">选择 1～3 种已拥有材料</p><div class="mats" id="mats"></div><button class="btn mainbtn" id="make">✦ 开始融合</button><p class="muted">提示：顾客的要求不一定只有一种答案。失败的作品也可能被图鉴收藏。</p></div><div class="panel result" id="result" style="display:none"><div class="resultshoe" id="rshoe"></div><h2 id="rname"></h2><div class="stars" id="rstars"></div><p id="rcomment"></p><div class="notice" id="newshoe" style="display:none">✨ 新鞋履发现！已收入图鉴</div><p id="reward"></p><button class="btn mainbtn" id="next">下一位顾客</button></div></section><section id="store" class="view"><div class="panel"><h2>🛒 材料商店</h2><p>把赚到的金币换成新的奇想可能。</p><div class="shopgrid" id="shopgrid"></div></div></section><section id="book" class="view"><div class="panel"><h2>📖 鞋履图鉴 <span id="count"></span></h2><div class="book" id="bookgrid"></div></div></section><section id="upgrade" class="view"><div class="panel"><h2>🏠 店铺成长</h2><p>名气会解锁新的客人与店铺内容。</p><div id="upgrades"></div></div></section></main><script>const mats={water:['💧','水滴',0],fire:['🔥','火焰',0],cloud:['☁️','云朵',0],star:['⭐','星光',200],jelly:['🪼','水母',350],bread:['🍞','吐司',450],wing:['🪽','飞翼',600],cactus:['🌵','仙人掌',700],bolt:['⚡','雷电',900],moon:['🌙','月光',1200]};const customers=[['🧚🏻‍♀️','暮光少女','我想要一双像落日一样温柔、在夜里会闪闪发光的鞋！',['🌅 暖光','✨ 闪光','🪽 轻盈'],['water','jelly','star']],['🐸','舞会青蛙','今晚我要去舞会，我想成为最闪亮的那一个！',['✨ 闪亮','🎉 华丽'],['star','cloud','jelly']],['👻','怕冷小幽灵','我的脚总是冷冰冰的，可以做一双暖和的鞋吗？',['🔥 温暖','☁️ 柔软'],['fire','cloud','bread']],['🧙‍♀️','迟到小魔女','我又要迟到了！有没有能让我飞快一点的鞋？',['💨 速度','🪽 轻盈'],['wing','bolt','star']],['🌙','梦游男孩','我每天晚上都会走到奇怪的地方……能把我送回梦里吗？',['🌙 梦境','✨ 神秘'],['moon','cloud','star']]];const recipes={'jelly,star,water':['海月轻语','🪼👟✨'],'cloud,jelly,star':['星云舞鞋','☁️👟✨'],'bread,cloud,fire':['熔岩烤吐司拖鞋','🔥🍞👟'],'bolt,star,wing':['流星火翼鞋','⚡🪽👟'],'cloud,moon,star':['月梦云履','🌙☁️👟']};let st=JSON.parse(localStorage.soleV3||'null')||{coins:500,fame:0,owned:['water','fire','cloud'],book:[],ci:0};let sel=new Set(),busy=false;const $=s=>document.querySelector(s),save=()=>{localStorage.soleV3=JSON.stringify(st);renderTop()},wait=n=>new Promise(r=>setTimeout(r,n));function renderTop(){$('#coins').textContent=st.coins;$('#fame').textContent=st.fame}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#'+b.dataset.v).classList.add('on');renderAll()});function renderCustomer(){let c=customers[st.ci%customers.length];$('#avatar').textContent=c[0];$('#cname').textContent=c[1]+'的订单';$('#ctext').textContent='“'+c[2]+'”';$('#tags').innerHTML=c[3].map(x=>'<span class="tag">'+x+'</span>').join('');$('#result').style.display='none';$('.panel.customer').style.display='flex';$('#make').closest('.panel').style.display='block';sel.clear();renderMats();$('#shoe').textContent='👟';$('#mixname').textContent='选择 1～3 种已拥有材料'}function renderMats(){$('#mats').innerHTML=Object.entries(mats).map(([id,m])=>'<button class="mat" data-id="'+id+'" '+(!st.owned.includes(id)?'disabled':'')+'>'+m[0]+'<small>'+m[1]+'</small></button>').join('');document.querySelectorAll('.mat').forEach(b=>b.onclick=()=>{if(busy)return;let id=b.dataset.id;if(sel.has(id)){sel.delete(id);b.classList.remove('on')}else if(sel.size<3){sel.add(id);b.classList.add('on')}$('#mixname').textContent=sel.size?[...sel].map(x=>mats[x][1]).join(' + '):'选择 1～3 种已拥有材料'})}function renderStore(){$('#shopgrid').innerHTML=Object.entries(mats).map(([id,m])=>{let own=st.owned.includes(id);return '<div class="card"><div class="ico">'+m[0]+'</div><b>'+m[1]+'</b><p>'+(own?'已拥有':'🪙 '+m[2])+'</p><button class="btn buy" data-id="'+id+'" '+(own?'disabled':'')+'>'+(own?'已拥有':'购买')+'</button></div>'}).join('');document.querySelectorAll('.buy').forEach(b=>b.onclick=()=>{let id=b.dataset.id,p=mats[id][2];if(st.coins<p)return alert('金币还不够，先去完成订单吧！');st.coins-=p;st.owned.push(id);save();renderStore();renderMats()})}function renderBook(){$('#count').textContent=st.book.length+' / 48';let a=st.book.map(x=>'<div class="card"><div class="ico">'+x.shoe+'</div><b>'+x.name+'</b><p>'+'⭐'.repeat(x.score)+'</p></div>').join('');a+=Array(Math.max(0,6-st.book.length)).fill('<div class="card locked"><div class="ico">👞</div><b>???</b><p>等待发现</p></div>').join('');$('#bookgrid').innerHTML=a}function renderUpgrade(){let data=[[5,'认识更多顾客','新的奇想订单开始出现'],[15,'增加货架','商店出现更多材料'],[30,'扩建店铺','迎接更多有趣的客人'],[50,'解锁新街区','遇见来自不同世界的人']];$('#upgrades').innerHTML=data.map(x=>'<div class="upgrade"><div><b>'+x[1]+'</b><div class="muted">'+x[2]+'</div></div><div>'+(st.fame>=x[0]?'✅ 已解锁':'⭐ '+x[0])+'</div></div>').join('')}function renderAll(){renderTop();renderStore();renderBook();renderUpgrade()}function key(){return[...sel].sort().join(',')}function particles(){let stage=$('#stage'),arr=[...sel];for(let i=0;i<14;i++){let d=document.createElement('div'),id=arr[i%arr.length];d.className='particle';d.textContent=mats[id][0];d.style.left=(5+Math.random()*85)+'%';d.style.top=(5+Math.random()*60)+'%';stage.appendChild(d);setTimeout(()=>d.remove(),1200)}}$('#make').onclick=async()=>{if(busy||!sel.size)return !sel.size&&alert('先选择材料吧！');busy=true;$('#mixname').textContent='材料正在共鸣……';particles();$('#shoe').classList.add('fuse');await wait(900);$('#stage').style.filter='brightness(2.2)';await wait(180);$('#stage').style.filter='';let r=recipes[key()],c=customers[st.ci%customers.length],hits=c[4].filter(x=>sel.has(x)).length,score=r?Math.max(3,hits+2):Math.min(5,1+hits);score=Math.max(1,Math.min(5,score));let name=r?r[0]:[...sel].map(x=>mats[x][1]).join('·')+'奇想鞋',shoe=r?r[1]:(sel.has('wing')?'🪽👟':sel.has('fire')?'🔥👟':sel.has('cloud')?'☁️👟':'✨👟');$('#shoe').textContent=shoe;await wait(450);let fresh=!st.book.some(x=>x.name===name);if(fresh)st.book.push({name,shoe,score});let reward=score*100;st.coins+=reward;st.fame+=score;save();$('.panel.customer').style.display='none';$('#make').closest('.panel').style.display='none';$('#result').style.display='block';$('#rshoe').textContent=shoe;$('#rname').textContent=name;$('#rstars').textContent='⭐'.repeat(score)+'☆'.repeat(5-score);$('#rcomment').textContent=score>=5?c[1]+'：太神奇了！这就是我想要的！':score>=3?c[1]+'：很有意思，我喜欢这个方向！':c[1]+'：好奇怪……但我好像想收藏它。';$('#newshoe').style.display=fresh?'block':'none';$('#reward').textContent='获得 🪙 '+reward+'　⭐ +'+score;renderAll();busy=false};$('#next').onclick=()=>{st.ci=(st.ci+1)%customers.length;save();renderCustomer();window.scrollTo({top:0,behavior:'smooth'})};renderAll();renderCustomer();</script></body></html>
